# Runs this application and its MongoDB database in containers with Podman.
# From the project's root:
#
#   podman-compose -f contrib/deployment/compose.yaml up --build -d
#
# Then open http://localhost:3000. See README.md in this folder.
name: angel3-app

services:
  db:
    image: docker.io/library/mongo:7
    environment:
      # The user MongoDB creates on its first start, in its `admin` database.
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-appuser}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-App1970}
    volumes:
      - db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    # The project's Containerfile compiles a native executable and runs it in a
    # `scratch` image, at ANGEL_ENV=production. The server serves the pages
    # and the files of `web/`, which the image includes.
    build:
      context: ../..
      dockerfile: Containerfile
    image: localhost/angel3-app:latest
    environment:
      ANGEL_ENV: production
      # The user logs in to the `admin` database, where `db` created it. A
      # password with characters such as `#`, `@` or `/` must be URL-encoded
      # here, as `%23`, `%40` or `%2F`.
      MONGO_URL: mongodb://${DB_USERNAME:-appuser}:${DB_PASSWORD:-App1970}@db:27017/appdb?authSource=admin
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Published on the host's loopback only; use "3000:3000" to expose it on
      # every interface, or put a reverse proxy in front.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    # The server only needs to listen and write logs.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
