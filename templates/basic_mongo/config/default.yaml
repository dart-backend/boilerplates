# Default server configuration.
# The JWT secret signs the app's tokens. If it is still INSECURE_DEFAULT_SECRET,
# replace it with a random one before deploying (`angel3 key` generates new
# ones), and keep it out of public repositories.
jwt_secret: INSECURE_DEFAULT_SECRET
host: 127.0.0.1
port: 3000
mongo:
  # The connection string of the database: its host, port and database name,
  # and `user:password@` before the host if it needs a login. The MONGO_URL
  # environment variable, if set, overrides it.
  url: mongodb://localhost:27017/appdb
  # How long to wait for the database when the server starts.
  timeout_in_seconds: 30
