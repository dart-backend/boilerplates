<div class="greetings">
  <h2>Greetings</h2>

  <form (ngSubmit)="add()">
    <input [(ngModel)]="message" placeholder="Say hello">
    <button type="submit">Add</button>
  </form>

  <p *ngIf="error != null" class="error">{{ error }}</p>

  <ul>
    <li *ngFor="let greeting of greetings">
      <span>{{ greeting.message }}</span>
      <button (click)="remove(greeting)">Delete</button>
    </li>
  </ul>

  <p *ngIf="greetings.isEmpty">No greetings yet.</p>
</div>
