# Default server configuration.
# The JWT secret signs the app's tokens. If it is still INSECURE_DEFAULT_SECRET,
# replace it with a random one before deploying (`angel3 key` generates new
# ones), and keep it out of public repositories.
jwt_secret: INSECURE_DEFAULT_SECRET
host: 127.0.0.1
port: 3000
client:
  # In development, the `build_runner serve` of the client, which the server
  # forwards to (see README.md).
  dev_server: http://127.0.0.1:8080
  # In production, the client as `build_runner build --release` wrote it.
  build_dir: client/build
