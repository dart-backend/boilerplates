name: starter_app
version: 1.0.0
description: A full-stack starter application template for Angel3 framework, with a Kelicap web client
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
workspace:
  - shared
  - client
dependencies:
  angel3_configuration: ^10.0.0
  angel3_framework: ^10.0.0
  angel3_production: ^10.0.0
  angel3_proxy: ^10.0.0
  angel3_static: ^10.0.0
  angel3_hot: ^10.0.0
  belatuk_pretty_logging: ^7.0.0
  file: ^7.0.1
  http: ^1.3.0
  logging: ^1.3.0
  shared:
    path: shared
dev_dependencies:
  angel3_test: ^10.0.0
  test: ^1.31.0
  lints: ^6.0.0
